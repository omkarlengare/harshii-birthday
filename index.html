function game(){

 const trigger=i=>{const o=q.options[i];seen.add(i);document.querySelectorAll('.drag-item').forEach(b=>{if(Number(b.dataset.choice)===i){b.classList.add('used');b.textContent=o.label+' ✓'}});byId('tried').textContent=`${seen.size} / 3 tried`;
 const images=byId('comic-images');images.classList.remove('comic-reveal');void images.offsetWidth;images.classList.add('comic-reveal');
 const ids=sceneSets[o.fx]||[1,0];const variant=(gameAt*3+i)%4;let boy=ids[1],girl=ids[0];if(o.fx==='cry')boy=4;if(o.fx==='faint')boy=2;if(o.fx==='chase')boy=0;if(o.fx==='snatch')girl=3;if(o.fx==='stare')girl=1;if(o.fx==='spin')boy=0;
 const pics=images.querySelectorAll('img');pics[0].src=`scene${boy}.webp`;pics[1].src=`scene${girl}.webp`;
 byId('comic-prop').textContent=sceneProps[o.fx]||'💥';byId('comic-header').textContent=sceneTitles[gameAt];byId('boy-bubble').textContent=boyLines[(gameAt*3+i)%boyLines.length];byId('girl-bubble').textContent=girlLines[(gameAt+i*5)%girlLines.length];
 const joke=reactionJokes[gameAt][i];byId('comic-caption').textContent=joke;byId('game-result').textContent=`${o.result}  •  ${seen.size}/3 seen`;
 if(seen.size===3)byId('game-next').disabled=false;
 };
 document.querySelectorAll('.drag-item').forEach(b=>{const i=Number(b.dataset.choice);b.onclick=()=>trigger(i);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();trigger(i)}};b.ondragstart=e=>{e.dataTransfer.setData('text/plain',String(i));b.classList.add('dragging')};b.ondragend=()=>b.classList.remove('dragging')});
 byId('stage').ondragover=e=>e.preventDefault();byId('stage').ondrop=e=>{e.preventDefault();const i=Number(e.dataTransfer.getData('text/plain'));if(Number.isInteger(i)&&i>=0&&i<3)trigger(i)};
 byId('game-next').onclick=()=>{gameAt++;seen=new Set();game()};
}

 const tools=[['🩴','Chappal Express'],['🪟','Window se fek do'],['✋','Chatta maar do'],['🥊','Boxing gloves'],['🧹','Jhaadu attack'],['🪶','Tickle torture'],['🛏️','Pillow fight'],['🌪️','Spin machine']];
 shell(`<div class="panel wide"><div class="eyebrow">Bonus game · Harshiii's revenge arcade 👑</div><h2>PITTI PITTI TEMM 😭🩴</h2><p class="sub">Omkar is your cartoon punching buddy. Pick a punishment and watch the full drama unfold 😂</p><canvas class="pitti-arena" id="pitti-canvas" width="900" height="510" aria-label="Animated cartoon boy reacting to different silly punishments"></canvas><div class="pitti-tools">${tools.map((t,i)=>`<button class="pitti-tool" data-pitti="${i}">${t[0]} ${t[1]}</button>`).join('')}</div><div class="pitti-status" id="pitti-status" aria-live="polite">Choose your weapon, Your Majesty 👑</div><div class="pitti-counter" id="pitti-count">0 punishments delivered · infinite drama remaining</div><button class="btn" id="pitti-next" style="margin-top:18px">Enough pitti... birthday message 💌 →</button></div>`);
 if(pittiController)pittiController.stop();pittiController=createPitti(byId('pitti-canvas'),(message,n)=>{byId('pitti-status').textContent=message;byId('pitti-count').textContent=`${n} punishments delivered · infinite drama remaining`});

function createPitti(canvas,notify){
 const ctx=canvas.getContext('2d');let active=-1,start=0,count=0,raf=0,alive=true,shake=0;
 const jokes=[
 'CHAPPAL AIRLINES: direct flight to Omm’s forehead! 🩴💀',
 'WINDOW SE FEK DIYAAA! Don’t worry, cartoon Omkar has a trampoline 😭🪟',
 'EK CHATTAAA! His last brain cell just resigned. ✋😭',
 'BOXING CHAMPION HARSHIII! Omkar is seeing 7 birthdays at once 🥊⭐',
 'JHAADU EXPRESS! He is sweeping his own tears now 🧹💨',
 'TICKLE TORTURE! He surrendered the Wi-Fi password too 😂🪶',
 'PILLOW ATTACK! Soft pillow, hard consequences 😭🛏️',
 'SPINNN! Omkar has become a washing machine 🌪️💫'
 ];
 const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));const ease=t=>1-Math.pow(1-clamp(t,0,1),3);
 function line(x,y,X,Y,width,color){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.lineWidth=width;ctx.lineCap='round';ctx.strokeStyle=color;ctx.stroke()}
 function ellipse(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
 function text(t,x,y,size=30){ctx.font=`${size}px system-ui,Apple Color Emoji,Segoe UI Emoji`;ctx.textAlign='center';ctx.fillText(t,x,y)}
 function buddy(x,y,t,mode){
  ctx.save();ctx.translate(x,y);let jump=0,rot=0,arm=0,leg=0,eyes='normal';
  if(mode===0){rot=Math.sin(t*19)*.12;arm=Math.sin(t*24)*.8;eyes='scared'}
  if(mode===1){rot=-ease(t/1.25)*Math.PI*1.6;arm=Math.sin(t*18)*1.4;leg=arm;eyes='scared'}
  if(mode===2){rot=Math.sin(t*25)*.19;arm=Math.sin(t*25)*.65;eyes='shock'}
  if(mode===3){rot=Math.sin(t*30)*.28;arm=Math.sin(t*30)*1.1;eyes='stars'}
  if(mode===4){rot=Math.sin(t*17)*.15;arm=Math.sin(t*25)*.8;eyes='scared'}
  if(mode===5){jump=-Math.abs(Math.sin(t*19))*28;arm=Math.sin(t*18)*1.2;eyes='laugh'}
  if(mode===6){rot=Math.sin(t*16)*.22;arm=Math.sin(t*16)*1.1;eyes='shock'}
  if(mode===7){rot=t*8;arm=Math.sin(t*24)*1.5;eyes='stars'}
  ctx.translate(0,jump);ctx.rotate(rot);
  // Articulated legs, torso, arms and head — all independently redrawn every frame.
  const hipY=25,shoulderY=-65;
  const lfoot={x:-24+Math.sin(t*11+leg)*12,y:115+Math.abs(Math.sin(t*10+leg))*9};
  const rfoot={x:25-Math.sin(t*11+leg)*12,y:115+Math.abs(Math.cos(t*10+leg))*9};
  line(-17,hipY,-24+Math.sin(t*10+leg)*10,75,24,'#34323c');line(-24+Math.sin(t*10+leg)*10,75,lfoot.x,lfoot.y,23,'#34323c');
  line(17,hipY,26-Math.sin(t*10+leg)*10,75,24,'#34323c');line(26-Math.sin(t*10+leg)*10,75,rfoot.x,rfoot.y,23,'#34323c');
  ellipse(lfoot.x,lfoot.y+5,23,12,'#fafcf6');ellipse(rfoot.x,rfoot.y+5,23,12,'#fafcf6');
  ctx.fillStyle='#819b79';ctx.beginPath();ctx.roundRect(-44,-89,88,123,27);ctx.fill();
  line(-39,shoulderY,-66-Math.sin(t*12+arm)*19,-16-Math.cos(t*12+arm)*20,20,'#819b79');
  line(39,shoulderY,66+Math.sin(t*12+arm)*19,-16+Math.cos(t*12+arm)*20,20,'#819b79');
  ellipse(-67-Math.sin(t*12+arm)*19,-14-Math.cos(t*12+arm)*20,12,12,'#f4c9ab');
  ellipse(67+Math.sin(t*12+arm)*19,-14+Math.cos(t*12+arm)*20,12,12,'#f4c9ab');
  ellipse(0,-128,49,53,'#f6cbb0');
  // tousled dark hair
  for(let i=0;i<9;i++){ellipse(-39+i*10,-170-Math.sin(i*1.7)*9,14,19,'#332d30')}
  ellipse(-36,-143,15,29,'#332d30');ellipse(38,-145,13,27,'#332d30');
  if(eyes==='stars'){text('✖',-18,-131,23);text('✖',19,-131,23)}
  else if(eyes==='laugh'){ctx.strokeStyle='#382c30';ctx.lineWidth=4;for(let k of [-18,18]){ctx.beginPath();ctx.arc(k,-129,9,Math.PI,2*Math.PI);ctx.stroke()}}
  else{ellipse(-18,-129,eyes==='scared'?6:4,eyes==='scared'?11:7,'#302d30');ellipse(18,-129,eyes==='scared'?6:4,eyes==='scared'?11:7,'#302d30')}
  ellipse(0,-106,eyes==='laugh'?13:eyes==='normal'?6:17,eyes==='laugh'?11:eyes==='normal'?4:22,'#9f465b');
  if(eyes==='scared'||eyes==='shock'){text('💧',-53,-104,22);text('💧',48,-98,22)}
  ctx.restore();
 }
 function draw(now){if(!alive)return;let t=active<0?0:(now-start)/1000;ctx.clearRect(0,0,900,510);
  const grad=ctx.createLinearGradient(0,0,0,510);grad.addColorStop(0,'#fff0e9');grad.addColorStop(1,'#ffe0de');ctx.fillStyle=grad;ctx.fillRect(0,0,900,510);
  // Room, birthday banners and ground
  ctx.fillStyle='#e9bac7';ctx.fillRect(0,425,900,85);line(0,425,900,425,5,'#d8a3b4');
  text('🎈',105,115,58);text('🎀',770,100,56);text('💗',440,78,40);
  ctx.fillStyle='#bd6481';ctx.font='bold 19px sans-serif';ctx.textAlign='center';ctx.fillText('HARSHIII’S REVENGE ROOM',450,42);
  let x=450,y=305,mode=active;
  if(active===1){ // window opens, boy travels on an arc, bounces safely on trampoline
    const travel=ease(t/1.4);x=450+travel*345;y=305-170*Math.sin(Math.PI*travel)+((t>1.4)?Math.abs(Math.sin((t-1.4)*11))*-65*Math.exp(-(t-1.4)):0);
    ctx.fillStyle='#b1e0ee';ctx.fillRect(660,125,200,215);ctx.strokeStyle='#e8fbff';ctx.lineWidth=13;ctx.strokeRect(660,125,200,215);line(760,125,760,340,7,'#fff');line(660,235,860,235,7,'#fff');
    text('🛟',805,416,75);
  }
  if(active===7){x=450+Math.sin(t*8)*32;y=305-25*Math.abs(Math.sin(t*7))}
  if(active===0||active===2||active===3||active===4||active===6)x+=Math.sin(t*21)*8;
  if(active===5)y-=Math.abs(Math.sin(t*17))*17;
  if(active>=0&&t<2.5){
    let progress=clamp(t/2.5,0,1);
    if(active===0){text('🩴',170+progress*420,220-80*Math.sin(progress*Math.PI),72);if(t>.5)text('💥',510,200,65)}
    if(active===1){text('💨',530,200,75);text('BOING!',760,380,38)}
    if(active===2){text('✋',220+Math.sin(t*18)*90,230,85);if(t>.4)text('💥',400,165,65)}
    if(active===3){text('🥊',220+Math.sin(t*24)*80,250,86);text('🥊',700-Math.sin(t*24)*80,250,86);text('⭐',550,140,45)}
    if(active===4){text('🧹',220+Math.sin(t*13)*110,250,90);text('💨',570,260,60)}
    if(active===5){text('🪶',220+Math.sin(t*19)*70,230,80);text('😂',620,175,55)}
    if(active===6){text('🛏️',210+Math.sin(t*14)*110,235,95);text('☁️',590,190,75)}
    if(active===7){for(let i=0;i<4;i++)text('💫',450+150*Math.cos(t*8+i*Math.PI/2),270+110*Math.sin(t*8+i*Math.PI/2),36)}
  }
  buddy(x,y,t,active);
  if(active<0){text('🥺',640,275,55);ctx.fillStyle='#9b5570';ctx.font='bold 24px sans-serif';ctx.fillText('Be gentle yrrr...',450,474)}
  else{ctx.fillStyle='#a04e6c';ctx.font='bold 23px sans-serif';ctx.fillText(t<2.5?'AAAAAA HARSHIIII 😭': 'I SURVIVED... barely 💀',450,476)}
  if(active>=0&&t>3.4){active=-1;start=0}
  raf=requestAnimationFrame(draw)
 }
 function action(i){if(!alive)return;active=i;start=performance.now();count++;notify(jokes[i],count)}
 raf=requestAnimationFrame(draw);return{action,stop(){alive=false;cancelAnimationFrame(raf)}};
}

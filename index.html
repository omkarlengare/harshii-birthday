function diary(){let entry=DIARY[diaryAt];shell(`<div class="panel wide"><div class="eyebrow">Part two · Pages from my heart</div><h2>Dear diary... 📖</h2><p class="sub">Five little moments that changed everything.</p><div class="diary-layout"><aside class="timeline">${DIARY.map((d,i)=>`<button data-page="${i}" class="${i===diaryAt?'current':''}">${esc(d.date)}</button>`).join('')}</aside><div class="book"><article class="page turn" key="${diaryAt}"><h3>${esc(entry.date)}</h3>${entry.lines.map(l=>`<p>${esc(l)}</p>`).join('')}</article></div></div><div class="diary-controls"><button class="btn alt small" id="prev" ${diaryAt===0?'disabled':''}>← Previous</button><button class="btn small" id="next">${diaryAt===4?'Next surprise 🎮':'Turn page →'}</button></div></div>`);document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{diaryAt=Number(b.dataset.page);diary()});byId('prev').onclick=()=>{diaryAt--;diary()};byId('next').onclick=()=>{if(diaryAt===4)go(3);else{diaryAt++;diary()}}}

colate se chup karoge? 🍫", "Chocolate bhi wapas aa gayi 😭"], ["UTHAA KE FEK DUNGIII!! Bhaago mat 🩴", "Chappal GPS pe chalti hai 😭"]], [["HAAWWWW!! Insta pe kisko like kiya?! 📱", "Ungli khud se chal gayiii 😭"], ["BHAAD ME JAAO!! Insta ne khud like kiya? 😤", "SORRYYY PHONE KI KASAM 😭"], ["TERI BEHEN DI JUTTI!! 500 screenshots hain! 📸", "Meri appeal reject ho gayiii 😭"]]];

const sceneProps=[['🍫','💐','🩴'],['🎁','🙏','🎂'],['🧹','💬','🩴'],['🍕','🍳','🍫'],['📶','📱','🛏️'],['🏆','☝️','💃'],['🎮','💻','❤️'],['🧸','🍦','🤗'],['🕊️','🍫','🩴'],['📱','🤖','📸']];
const sceneTitles=['Gussa mode','Birthday bhool gaye?!','Dusri ladki cute?!','Bhookh lagiii','Reply kyun nahi kiya?!','Argument jeet gaye?!','Gaming pakda gaya','Rula diya?!','CALM DOWN?!','Instagram kaand'];
function sceneSVG(q,choice=-1){
 const chosen=choice>=0, prop=chosen?sceneProps[q][choice]:'💗';
 const girlMood=chosen?(q===3||q===7?'smug':'angry'):'waiting';
 const eyes=girlMood==='angry'?`<path d="M-29 -2 l20 8 M9 8 l20 -10" stroke="#682b39" stroke-width="5" stroke-linecap="round"/><path d="M-18 17 h8 M10 17 h8" stroke="#fff" stroke-width="5"/>`:girlMood==='smug'?`<path d="M-28 9 q12 13 23 0 M5 9 q12 13 23 0" fill="none" stroke="#5c3440" stroke-width="4"/>`:`<ellipse cx="-15" cy="8" rx="5" ry="8" fill="#4b3441"/><ellipse cx="15" cy="8" rx="5" ry="8" fill="#4b3441"/>`;
 const mouth=girlMood==='angry'?`<path d="M-14 34 Q0 18 14 34" fill="none" stroke="#a43b49" stroke-width="5"/>`:girlMood==='smug'?`<path d="M-14 26 Q0 44 15 26" fill="none" stroke="#a43b49" stroke-width="4"/>`:`<path d="M-11 30 Q0 38 11 30" fill="none" stroke="#a43b49" stroke-width="4"/>`;
 return `<svg class="reaction-svg" viewBox="0 0 680 360" role="img" aria-label="Cartoon scene: ${esc(sceneTitles[q])}, ${chosen?'Banda apologising and Harshiii reacting':'Banda and Harshiii waiting'}" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sceneBg" x2="1" y2="1"><stop stop-color="#fff6e9"/><stop offset="1" stop-color="#ffe0ed"/></linearGradient></defs><rect width="680" height="360" rx="22" fill="url(#sceneBg)"/><ellipse cx="190" cy="313" rx="115" ry="14" fill="#cfb2b9" opacity=".4"/><ellipse cx="495" cy="313" rx="115" ry="14" fill="#cfb2b9" opacity=".4"/>
 <g transform="translate(190 162)"><path d="M-62 80 Q-98 125 -78 151 L-24 155 L-8 112 L14 156 L76 151 Q91 125 58 80" fill="#41424b"/><path d="M-63 70 Q-86 77 -80 135 L-30 139 L-7 108 L23 139 L80 135 Q83 80 58 70" fill="#96ad8b" stroke="#647c62" stroke-width="3"/><path d="M-48 89 L-86 121 M47 89 L84 121" stroke="#96ad8b" stroke-width="20" stroke-linecap="round"/><ellipse cx="0" cy="0" rx="66" ry="73" fill="#f9c8a9" stroke="#a67865" stroke-width="2"/><path d="M-67 -6 Q-88 -90 -18 -85 Q25 -113 66 -68 Q83 -40 60 -7 L43 -42 L19 -37 L0 -55 L-25 -32 L-54 -43Z" fill="#352c32"/><ellipse cx="-22" cy="8" rx="6" ry="10" fill="#47363d"/><ellipse cx="22" cy="8" rx="6" ry="10" fill="#47363d"/><path d="M-13 38 Q0 48 13 38" fill="none" stroke="#a64b59" stroke-width="4"/>${chosen?`<path d="M-34 30 q-8 23 2 36 q11 2 11 -8z M30 30 q-8 23 2 36 q11 2 11 -8z" fill="#78c8ee"/>`:''}</g>
 <g transform="translate(495 162)"><path d="M-55 79 L-67 155 L-12 155 L0 115 L15 155 L70 155 L56 79" fill="#f7e9d5" stroke="#bda68c" stroke-width="2"/><path d="M-64 77 Q-88 102 -75 135 L-27 139 L0 111 L25 139 L79 135 Q88 100 63 77" fill="#bd94d3" stroke="#9361ad" stroke-width="3"/><path d="M-50 87 L-83 115 M52 87 L83 115" stroke="#bd94d3" stroke-width="21" stroke-linecap="round"/><path d="M-70 -5 Q-92 -87 -25 -99 Q38 -114 72 -60 Q100 22 69 90 L46 90 L49 -40 L-46 -38 L-48 90 L-73 90Z" fill="#744239"/><ellipse cx="0" cy="0" rx="64" ry="73" fill="#ffcfb4" stroke="#ac7965" stroke-width="2"/><path d="M-66 -9 Q-83 -75 -25 -85 Q25 -106 67 -61 L60 -12 L41 -45 L17 -36 L-6 -51 L-31 -31 L-53 -37Z" fill="#744239"/><rect x="27" y="-46" width="19" height="5" rx="2" fill="#f9f4ee"/><rect x="29" y="-37" width="19" height="5" rx="2" fill="#f9f4ee"/>${eyes}${mouth}${girlMood==='angry'?`<path d="M-73 -62 Q-85 -102 -58 -113 M70 -65 Q95 -108 77 -118" fill="none" stroke="#ff6649" stroke-width="9" stroke-linecap="round"/>`:''}</g>
 <text x="340" y="83" text-anchor="middle" font-size="54">${prop}</text><text x="190" y="339" text-anchor="middle" font-size="19" font-weight="bold" fill="#53674d">BANDA ${chosen?'😭':'🥺'}</text><text x="495" y="339" text-anchor="middle" font-size="19" font-weight="bold" fill="#9a4e76">HARSHIII ${chosen?'😤':'👑'}</text></svg>`;
}

function game(){
 if(gameAt>=GAME.length){shell(`<div class="panel"><div style="font-size:64px">👑💗</div><h1>Harshiii jeet gayiii!!</h1><p>10 questions aur Bande ki 30 baar pitti 😭😂</p><button class="btn" id="next">Birthday message 💌 →</button></div>`);byId('next').onclick=()=>go(4);return}
 const q=GAME[gameAt];
 shell(`<div class="panel wide"><div class="eyebrow">Part three · Harshiii ka raaj 👑</div><h2>Girlfriend is always right 😭</h2><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:#a46c7f"><span>Question ${gameAt+1} / ${GAME.length}</span><span id="tried">${seen.size} / 3 tried</span></div><div class="progress"><div style="width:${gameAt/GAME.length*100}%"></div></div><h3>${esc(q.q)}</h3><div class="comic-stage" id="stage"><div id="comic-picture">${sceneSVG(gameAt)}</div><div class="comic-dialogue" id="comic-dialogue" hidden><div class="comic-speech girl-speech" id="girl-bubble"></div><div class="comic-speech boy-speech" id="boy-bubble"></div></div></div><p class="drop-hint">Option pe tap karo ya picture par drag karo 👆</p><div class="drag-grid">${q.options.map((o,i)=>`<div class="drag-item ${seen.has(i)?'used':''}" draggable="true" role="button" tabindex="0" data-choice="${i}">${esc(o.label)} ${seen.has(i)?'✓':''}</div>`).join('')}</div><div class="game-result" id="game-result" aria-live="polite">Koi bhi option try karo... ya seedha next! 😂</div><button class="btn" id="game-next">${gameAt===GAME.length-1?'Finish game →':'Next question →'}</button></div>`);
 const trigger=i=>{const o=q.options[i];seen.add(i);document.querySelectorAll('.drag-item').forEach(b=>{if(Number(b.dataset.choice)===i){b.classList.add('used');b.textContent=o.label+' ✓'}});byId('tried').textContent=`${seen.size} / 3 tried`;
 const pic=byId('comic-picture');pic.innerHTML=sceneSVG(gameAt,i);pic.classList.remove('comic-reveal');void pic.offsetWidth;pic.classList.add('comic-reveal');
 const [girl,boy]=hindiReactions[gameAt][i];byId('comic-dialogue').hidden=false;byId('girl-bubble').textContent='👑 Harshiii: '+girl;byId('boy-bubble').textContent='😭 Banda: '+boy;byId('game-result').textContent=`${seen.size}/3 options dekhe... 😂`;
 };
 document.querySelectorAll('.drag-item').forEach(b=>{const i=Number(b.dataset.choice);b.onclick=()=>trigger(i);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();trigger(i)}};b.ondragstart=e=>{e.dataTransfer.setData('text/plain',String(i));b.classList.add('dragging')};b.ondragend=()=>b.classList.remove('dragging')});
 byId('stage').ondragover=e=>e.preventDefault();byId('stage').ondrop=e=>{e.preventDefault();const i=Number(e.dataTransfer.getData('text/plain'));if(Number.isInteger(i)&&i>=0&&i<3)trigger(i)};
 byId('game-next').onclick=()=>{gameAt++;seen=new Set();game()};
}

function letter(){shell(`<div class="panel wide"><div class="eyebrow">Part four · A little letter to you</div><h2>To my favourite person in the world 💌</h2><div class="letter"><p>${esc(BIRTHDAY)}</p></div><div style="margin-top:25px"><button class="btn" id="next">One last surprise for you... 🎁</button></div></div>`);byId('next').onclick=()=>go(5)}
function burst(n=32){let symbols=['💗','❤️','💕','✨','🎉','🎊','🎈','💋','🌸','💖'];for(let i=0;i<n;i++){let el=document.createElement('span');el.className='confetti';el.textContent=pick(symbols);el.style.left=(10+Math.random()*80)+'vw';el.style.top=(70+Math.random()*20)+'vh';el.style.setProperty('--dx',(Math.random()*280-140)+'px');el.style.setProperty('--dur',(2+Math.random()*2.5)+'s');el.style.animationDelay=(Math.random()*.7)+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),5500)}}
function gift(){giftOpened=false;if(particles){clearInterval(particles);particles=null}shell(`<div class="panel"><div class="eyebrow">Part five · The last little surprise</div><h1>One last gift for you... 🎁</h1><p class="sub" id="gift-intro">It's something that makes my whole day better 🥹</p><div class="giftbox" id="giftbox" role="button" tabindex="0" aria-label="Tap to open gift"><div class="cat">🐱</div><span class="kiss">💋</span><span class="kiss two">💗</span><span class="kiss three">😘</span><div class="gift-base"></div><div class="gift-lid"></div><div class="bow">🎀</div></div><button class="btn" id="open-gift">Tap to open your gift 💝</button><div class="hidden" id="gift-reveal"><div class="gift-message">And thissss... is my favourite sound in the entire world. ❤️</div><p class="sub">Your laugh. My favourite kind of magic. 🥹💕</p><div class="audio-controls"><button class="btn alt small" id="replay">🔊 Hear it again</button><button class="btn alt small" id="pause">⏸ Pause</button></div><p class="footnote">HAPPYYYY BIRTHDAYYYY MERIII HARSHIIII !!! ❤️</p></div><audio id="laugh-audio" preload="auto" src="laugh.mpeg"></audio></div>`);const open=()=>{if(!giftOpened){giftOpened=true;byId('giftbox').classList.add('open');byId('open-gift').classList.add('hidden');byId('gift-reveal').classList.remove('hidden');byId('gift-intro').textContent='Sending you a million kisses! 🐱💋';burst(52);particles=setInterval(()=>{if(document.visibilityState==='visible')burst(6)},3500)}let a=byId('laugh-audio');a.currentTime=0;a.play().catch(()=>{byId('gift-intro').textContent='Tap “Hear it again” to play your gift 💗'})};byId('giftbox').onclick=open;byId('giftbox').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};byId('open-gift').onclick=open;byId('replay').onclick=()=>{let a=byId('laugh-audio');a.currentTime=0;a.play();burst(25)};byId('pause').onclick=()=>{let a=byId('laugh-audio');if(a.paused){a.play();byId('pause').textContent='⏸ Pause'}else{a.pause();byId('pause').textContent='▶️ Resume'}}}
// Session-only visual gate. GitHub Pages files remain publicly accessible.
if(sessionStorage.getItem('birthdayUnlocked')==='yes')section=1;render();
</script></body></html>
